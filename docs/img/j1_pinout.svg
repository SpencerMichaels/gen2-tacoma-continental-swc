<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" role="img" aria-label="J1 harness plug pinout, looking into the plug, latch up">
<style>
  :root { --fg:#1f2328; --mute:#59636e; --box:#f6f8fa; --edge:#d0d7de; --gap:#eaeef2;
          --c1:#0969da; --c2:#1a7f37; --c3:#bc4c00; --c4:#8250df; --c5:#bf3989; --c6:#9a6700; --c7:#1b7c83; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --mute:#9198a1; --box:#161b22; --edge:#3d444d; --gap:#21262d;
            --c1:#4493f8; --c2:#3fb950; --c3:#f0883e; --c4:#ab7df8; --c5:#f778ba; --c6:#d29922; --c7:#39c5cf; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
  .t { font-size: 15px; font-weight: 600; }
  .s { font-size: 12px; fill: var(--mute); }
  .lab { font-size: 12px; font-weight: 600; }
  .w { font-size: 11.5px; font-weight: 600; fill: #ffffff; }
  .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
  .gap { fill: var(--gap); stroke: var(--edge); stroke-width: 1; }
  .tick { stroke: var(--mute); stroke-width: 1; }
</style>
<text class="t" x="20" y="28">Looking into the harness plug (wires behind), latch up</text>
<rect class="box" x="60" y="70" width="460" height="190" rx="14"/>
<rect class="box" x="240" y="48" width="100" height="24" rx="4"/><text class="s" x="290" y="65" text-anchor="middle">latch</text>
<rect x="90" y="100" width="56" height="56" rx="6" class="gap"/>
<text class="s" x="118" y="124" text-anchor="middle" style="font-size:15px">7</text>
<text class="s" x="118" y="144" text-anchor="middle" style="font-size:10.5px">—</text>
<rect x="162" y="100" width="56" height="56" rx="6" style="fill:var(--c5);stroke:none"/>
<text class="w" x="190" y="124" text-anchor="middle" style="font-size:15px">8</text>
<text class="w" x="190" y="144" text-anchor="middle" style="font-size:10.5px">SW2</text>
<rect x="234" y="100" width="56" height="56" rx="6" style="fill:var(--c4);stroke:none"/>
<text class="w" x="262" y="124" text-anchor="middle" style="font-size:15px">9</text>
<text class="w" x="262" y="144" text-anchor="middle" style="font-size:10.5px">SWRC+</text>
<rect x="306" y="100" width="56" height="56" rx="6" style="fill:var(--c4);stroke:none"/>
<text class="w" x="334" y="124" text-anchor="middle" style="font-size:15px">10</text>
<text class="w" x="334" y="144" text-anchor="middle" style="font-size:10.5px">SWRC GND</text>
<rect x="378" y="100" width="56" height="56" rx="6" class="gap"/>
<text class="s" x="406" y="124" text-anchor="middle" style="font-size:15px">11</text>
<text class="s" x="406" y="144" text-anchor="middle" style="font-size:10.5px">(unused)</text>
<rect x="450" y="100" width="56" height="56" rx="6" style="fill:var(--c3);stroke:none"/>
<text class="w" x="478" y="124" text-anchor="middle" style="font-size:15px">12</text>
<text class="w" x="478" y="144" text-anchor="middle" style="font-size:10.5px">ACC</text>
<rect x="90" y="180" width="56" height="56" rx="6" class="gap"/>
<text class="s" x="118" y="204" text-anchor="middle" style="font-size:15px">1</text>
<text class="s" x="118" y="224" text-anchor="middle" style="font-size:10.5px">—</text>
<rect x="162" y="180" width="56" height="56" rx="6" class="gap"/>
<text class="s" x="190" y="204" text-anchor="middle" style="font-size:15px">2</text>
<text class="s" x="190" y="224" text-anchor="middle" style="font-size:10.5px">—</text>
<rect x="234" y="180" width="56" height="56" rx="6" class="gap"/>
<text class="s" x="262" y="204" text-anchor="middle" style="font-size:15px">3</text>
<text class="s" x="262" y="224" text-anchor="middle" style="font-size:10.5px">—</text>
<rect x="306" y="180" width="56" height="56" rx="6" style="fill:var(--c1);stroke:none"/>
<text class="w" x="334" y="204" text-anchor="middle" style="font-size:15px">4</text>
<text class="w" x="334" y="224" text-anchor="middle" style="font-size:10.5px">SW1</text>
<rect x="378" y="180" width="56" height="56" rx="6" class="gap"/>
<text class="s" x="406" y="204" text-anchor="middle" style="font-size:15px">5</text>
<text class="s" x="406" y="224" text-anchor="middle" style="font-size:10.5px">—</text>
<rect x="450" y="180" width="56" height="56" rx="6" style="fill:var(--c2);stroke:none"/>
<text class="w" x="478" y="204" text-anchor="middle" style="font-size:15px">6</text>
<text class="w" x="478" y="224" text-anchor="middle" style="font-size:10.5px">GND</text>
<text class="lab" x="545" y="88">SW1 (pin 4)</text><text class="s" x="545" y="101">wheel ladder 1: Seek ±, Volume ±</text>
<text class="lab" x="545" y="114">SW2 (pin 8)</text><text class="s" x="545" y="127">wheel ladder 2: Mode, Answer, Hang Up</text>
<text class="lab" x="545" y="140">SWRC+ (pin 9)</text><text class="s" x="545" y="153">red, to the radio's 3.5 mm plug tip</text>
<text class="lab" x="545" y="166">SWRC GND (pin 10)</text><text class="s" x="545" y="179">white, to the radio's SWRC GND</text>
<text class="lab" x="545" y="192">ACC (pin 12)</text><text class="s" x="545" y="205">switched 12 V</text>
<text class="lab" x="545" y="218">GND (pin 6)</text><text class="s" x="545" y="231">vehicle ground, bonded to SWG</text>
<text class="lab" x="545" y="244">pin 11</text><text class="s" x="545" y="257">harness wire present, not used</text>
<text class="s" x="20" y="300">The board header's mating face is the mirror image of this view. Molex numbering: 1–6 bottom row, 7–12 top row.</text>
</svg>
